# SonarQube Project Configuration
sonar.projectKey=inky-frame-server
sonar.projectName=inky-frame-server
sonar.projectVersion=1.0.0

# Source and Test directories
sonar.sources=backend/src,frontend/src
sonar.tests=backend/test,backend/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.html,**/*.svg,bun.lock,*.yaml

# Encoding & Language Settings
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.json

# Test Coverage (Bun / Jest coverage reports)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
